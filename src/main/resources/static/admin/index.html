<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI翻译管理后台</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/layui@2.9.8/dist/css/layui.css">
    <link rel="stylesheet" href="/admin/css/admin.css">
    <style>
        .layui-layout-admin .layui-header {
            background: #2d3a4b;
        }

        .layui-layout-admin .layui-side {
            background: #2d3a4b;
        }

        .layui-layout-admin .layui-side .layui-nav-item a {
            color: #b8c7ce;
        }

        .layui-layout-admin .layui-side .layui-nav-item a:hover,
        .layui-layout-admin .layui-side .layui-nav-item a.layui-this {
            color: #fff;
            background: #667eea;
        }

        .layui-layout-admin .layui-side .layui-nav .layui-nav-itemed > a {
            color: #fff;
        }

        .admin-title {
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            line-height: 60px;
            padding: 0 20px;
        }

        .admin-title i {
            margin-right: 8px;
        }

        .admin-info {
            float: right;
            line-height: 60px;
            padding-right: 20px;
            color: #ccc;
        }

        .admin-info span {
            margin-left: 15px;
            cursor: pointer;
        }

        .admin-info span:hover {
            color: #667eea;
        }
    </style>
</head>
<body class="layui-layout-body">
<div class="layui-layout layui-layout-admin">
    <div class="layui-header">
        <div class="admin-title"><i class="layui-icon layui-icon-translate"></i>AI翻译管理后台</div>
        <div class="admin-info">
            <span id="adminNickname">管理员</span>
            <span onclick="logout()"><i class="layui-icon layui-icon-logout"></i> 退出</span>
        </div>
    </div>
    <div class="layui-side layui-bg-black">
        <div class="layui-side-scroll">
            <ul class="layui-nav layui-nav-tree" lay-filter="adminNav">
                <li class="layui-nav-item layui-this"><a lay-href="/admin/pages/dashboard.html"><i
                        class="layui-icon layui-icon-home"></i> 数据看板</a></li>
                <li class="layui-nav-item"><a lay-href="/admin/pages/user.html"><i
                        class="layui-icon layui-icon-user"></i> 用户管理</a></li>
                <li class="layui-nav-item"><a lay-href="/admin/pages/order.html"><i
                        class="layui-icon layui-icon-rmb"></i> 订单管理</a></li>
                <li class="layui-nav-item"><a lay-href="/admin/pages/refund.html"><i
                        class="layui-icon layui-icon-return"></i> 退款管理</a></li>
                <li class="layui-nav-item"><a lay-href="/admin/pages/consume.html"><i
                        class="layui-icon layui-icon-chart"></i> 消耗流水</a></li>
                <li class="layui-nav-item"><a lay-href="/admin/pages/token.html"><i
                        class="layui-icon layui-icon-chart-screen"></i> Token统计</a></li>
                <li class="layui-nav-item"><a lay-href="/admin/pages/config.html"><i
                        class="layui-icon layui-icon-set"></i> 系统配置</a></li>
                <li class="layui-nav-item"><a lay-href="/admin/pages/notice.html"><i
                        class="layui-icon layui-icon-notice"></i> 公告管理</a></li>
                <li class="layui-nav-item"><a lay-href="/admin/pages/feedback.html"><i
                        class="layui-icon layui-icon-dialogue"></i> 反馈管理</a></li>
            </ul>
        </div>
    </div>
    <div class="layui-body">
        <div id="contentArea"></div>
    </div>
    <div class="layui-footer" style="text-align:center;">AI翻译服务 &copy; 2024</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/layui@2.9.8/dist/layui.js"></script>
<script src="/admin/js/common.js"></script>
<script>
    checkAuth();
    document.getElementById('adminNickname').textContent = localStorage.getItem('admin_nickname') || '管理员';

    layui.use(['element', 'layer'], function () {
        var element = layui.element;
        var $ = layui.$;

        /* 导航点击加载页面 */
        $(document).on('click', '.layui-nav-item a[lay-href]', function () {
            var href = $(this).attr('lay-href');
            $('.layui-nav-item').removeClass('layui-this');
            $(this).parent().addClass('layui-this');
            $('#contentArea').load(href);
        });

        /* 默认加载看板 */
        $('#contentArea').load('/admin/pages/dashboard.html');
    });
</script>
</body>
</html>
