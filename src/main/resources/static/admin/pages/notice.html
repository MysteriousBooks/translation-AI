<div class="layui-fluid" style="padding:20px;">
    <div class="layui-card">
        <div class="layui-card-header">公告管理</div>
        <div class="layui-card-body">
            <div style="margin-bottom:15px;">
                <button class="layui-btn" id="addNoticeBtn"><i class="layui-icon layui-icon-addition"></i> 新建公告</button>
            </div>
            <table id="noticeTable" lay-filter="noticeTable"></table>
        </div>
    </div>
</div>

<script type="text/html" id="noticeBar">
    <a class="layui-btn layui-btn-xs" lay-event="edit">编辑</a>
    <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del">删除</a>
</script>

<script>
    layui.use(['table', 'layer', 'form'], function () {
        var table = layui.table;
        var layer = layui.layer;
        var form = layui.form;

        table.render({
            elem: '#noticeTable',
            url: '',
            page: true,
            limit: 10,
            cols: [[
                {field: 'id', title: 'ID', width: 70},
                {field: 'title', title: '标题', width: 200},
                {
                    field: 'type', title: '类型', width: 90, templet: function (d) {
                        return d.type === 1 ? '通知' : '公告';
                    }
                },
                {
                    field: 'status', title: '状态', width: 90, templet: function (d) {
                        return d.status === 1 ? '<span class="layui-badge layui-bg-green">已发布</span>' : '<span class="layui-badge layui-bg-gray">草稿</span>';
                    }
                },
                {field: 'publishTime', title: '发布时间', width: 170},
                {field: 'createTime', title: '创建时间', width: 170},
                {title: '操作', width: 140, fixed: 'right', toolbar: '#noticeBar'}
            ]]
        });

        function loadData(params) {
            var p = {page: 1, size: 10};
            if (params) Object.assign(p, params);
            API.get('/api/admin/notice/list', p, function (res) {
                if (res.code === 200) {
                    table.reload('noticeTable', {
                        data: res.data.records,
                        page: {curr: res.data.current, limit: res.data.size, count: res.data.total}
                    });
                }
            });
        }

        loadData();

        function openNoticeForm(title, data) {
            var html = '<form class="layui-form" lay-filter="noticeEditForm" style="padding:20px;">';
            html += '<div class="layui-form-item"><label class="layui-form-label">标题</label><div class="layui-input-block"><input type="text" name="title" value="' + (data ? data.title : '') + '" class="layui-input" lay-verify="required"></div></div>';
            html += '<div class="layui-form-item"><label class="layui-form-label">类型</label><div class="layui-input-block"><select name="type"><option value="1"' + (data && data.type === 1 ? ' selected' : '') + '>通知</option><option value="2"' + (data && data.type === 2 ? ' selected' : '') + '>公告</option></select></div></div>';
            html += '<div class="layui-form-item"><label class="layui-form-label">状态</label><div class="layui-input-block"><select name="status"><option value="0"' + (data && data.status === 0 ? ' selected' : '') + '>草稿</option><option value="1"' + (data && data.status === 1 ? ' selected' : '') + '>已发布</option></select></div></div>';
            html += '<div class="layui-form-item layui-form-text"><label class="layui-form-label">内容</label><div class="layui-input-block"><textarea name="content" class="layui-textarea" style="height:150px;" lay-verify="required">' + (data ? data.content : '') + '</textarea></div></div>';
            html += '</form>';

            layer.open({
                type: 1,
                title: title,
                area: ['550px', '450px'],
                content: html,
                btn: ['保存', '取消'],
                yes: function (index) {
                    var formData = {};
                    $(layer.getChildFrame ? '.layui-layer-content' : '#layui-layer' + index).find('input,select,textarea').each(function () {
                        formData[$(this).attr('name')] = $(this).val();
                    });
                    /* 重新从弹窗DOM获取值 */
                    formData = {
                        title: $('[name="title"]').last().val(),
                        type: parseInt($('[name="type"]').last().val()),
                        status: parseInt($('[name="status"]').last().val()),
                        content: $('[name="content"]').last().val()
                    };
                    if (!formData.title || !formData.content) {
                        layer.msg('标题和内容不能为空');
                        return;
                    }
                    if (data && data.id) {
                        API.put('/api/admin/notice/' + data.id, formData, function (res) {
                            if (res.code === 200) {
                                layer.msg('更新成功');
                                loadData({
                                    page: $('.layui-laypage-curr .layui-laypage-em').next().text() || 1,
                                    size: 10
                                });
                                layer.close(index);
                            } else {
                                layer.msg(res.message || '操作失败');
                            }
                        });
                    } else {
                        API.post('/api/admin/notice', formData, function (res) {
                            if (res.code === 200) {
                                layer.msg('创建成功');
                                loadData({size: 10});
                                layer.close(index);
                            } else {
                                layer.msg(res.message || '操作失败');
                            }
                        });
                    }
                }
            });
            form.render('select');
        }

        $('#addNoticeBtn').on('click', function () {
            openNoticeForm('新建公告', null);
        });

        table.on('tool(noticeTable)', function (obj) {
            var data = obj.data;
            if (obj.event === 'edit') {
                openNoticeForm('编辑公告', data);
            } else if (obj.event === 'del') {
                layer.confirm('确定删除该公告吗？', function (index) {
                    API.del('/api/admin/notice/' + data.id, function (res) {
                        if (res.code === 200) {
                            layer.msg('删除成功');
                            loadData({page: $('.layui-laypage-curr .layui-laypage-em').next().text() || 1, size: 10});
                        } else {
                            layer.msg(res.message || '删除失败');
                        }
                        layer.close(index);
                    });
                });
            }
        });

        table.on('page(noticeTable)', function (obj) {
            var formData = {page: obj.curr, size: obj.limit};
            loadData(formData);
        });
    });
</script>
