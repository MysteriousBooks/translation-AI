<div class="layui-fluid" style="padding:20px;">
    <div class="layui-card">
        <div class="layui-card-header">订单管理</div>
        <div class="layui-card-body">
            <form class="layui-form" id="orderSearchForm" lay-filter="orderSearchForm">
                <div class="layui-form-item">
                    <div class="layui-inline">
                        <label class="layui-form-label">关键词</label>
                        <div class="layui-input-inline">
                            <input type="text" name="keyword" placeholder="订单号/用户邮箱" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-inline">
                        <label class="layui-form-label">状态</label>
                        <div class="layui-input-inline">
                            <select name="status">
                                <option value="">全部</option>
                                <option value="0">待支付</option>
                                <option value="1">已支付</option>
                                <option value="2">已取消</option>
                                <option value="3">已退款</option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline">
                        <button class="layui-btn" lay-submit lay-filter="searchOrder"><i
                                class="layui-icon layui-icon-search"></i> 搜索
                        </button>
                        <button type="reset" class="layui-btn layui-btn-primary">重置</button>
                    </div>
                </div>
            </form>
            <table id="orderTable" lay-filter="orderTable"></table>
        </div>
    </div>
</div>

<script>
    layui.use(['table', 'form', 'layer'], function () {
        var table = layui.table;
        var form = layui.form;
        var layer = layui.layer;

        table.render({
            elem: '#orderTable',
            url: '',
            page: true,
            limit: 10,
            cols: [[
                {field: 'id', title: 'ID', width: 70},
                {field: 'orderNo', title: '订单号', width: 200},
                {field: 'userEmail', title: '用户邮箱', width: 170},
                {field: 'userNickname', title: '用户昵称', width: 110},
                {
                    field: 'payType', title: '支付方式', width: 100, templet: function (d) {
                        return PayTypeMap[d.payType] || d.payType;
                    }
                },
                {field: 'amount', title: '金额(元)', width: 100},
                {
                    field: 'status', title: '状态', width: 100, templet: function (d) {
                        var cls = {0: 'layui-bg-gray', 1: 'layui-bg-green', 2: '', 3: 'layui-bg-orange'};
                        return '<span class="layui-badge ' + (cls[d.status] || '') + '">' + (OrderStatusMap[d.status] || d.status) + '</span>';
                    }
                },
                {field: 'transactionId', title: '交易号', width: 200},
                {field: 'payTime', title: '支付时间', width: 170},
                {field: 'createTime', title: '创建时间', width: 170},
                {title: '操作', width: 80, fixed: 'right', toolbar: '#orderBar'}
            ]]
        });

        function loadData(params) {
            var p = {page: 1, size: 10};
            if (params) Object.assign(p, params);
            API.get('/api/admin/order/list', p, function (res) {
                if (res.code === 200) {
                    table.reload('orderTable', {
                        data: res.data.records,
                        page: {curr: res.data.current, limit: res.data.size, count: res.data.total}
                    });
                }
            });
        }

        loadData();

        table.on('tool(orderTable)', function (obj) {
            if (obj.event === 'detail') {
                API.get('/api/admin/order/' + obj.data.id, {}, function (res) {
                    if (res.code === 200) {
                        var o = res.data;
                        var html = '<table class="layui-table" lay-skin="nob">';
                        html += '<tr><td>订单ID</td><td>' + o.id + '</td></tr>';
                        html += '<tr><td>订单号</td><td>' + (o.orderNo || '-') + '</td></tr>';
                        html += '<tr><td>用户邮箱</td><td>' + (o.userEmail || '-') + '</td></tr>';
                        html += '<tr><td>用户昵称</td><td>' + (o.userNickname || '-') + '</td></tr>';
                        html += '<tr><td>支付方式</td><td>' + (PayTypeMap[o.payType] || o.payType) + '</td></tr>';
                        html += '<tr><td>金额</td><td>' + o.amount + ' 元</td></tr>';
                        html += '<tr><td>状态</td><td>' + (OrderStatusMap[o.status] || o.status) + '</td></tr>';
                        html += '<tr><td>交易号</td><td>' + (o.transactionId || '-') + '</td></tr>';
                        html += '<tr><td>支付时间</td><td>' + (o.payTime || '-') + '</td></tr>';
                        html += '<tr><td>创建时间</td><td>' + (o.createTime || '-') + '</td></tr>';
                        html += '</table>';
                        layer.open({type: 1, title: '订单详情', area: ['500px', '420px'], content: html});
                    }
                });
            }
        });

        form.on('submit(searchOrder)', function (data) {
            loadData(data.field);
            return false;
        });

        table.on('page(orderTable)', function (obj) {
            var formData = {};
            var f = $('#orderSearchForm').serializeArray();
            for (var i = 0; i < f.length; i++) {
                formData[f[i].name] = f[i].value;
            }
            formData.page = obj.curr;
            formData.size = obj.limit;
            loadData(formData);
        });
    });
</script>

<script type="text/html" id="orderBar">
    <a class="layui-btn layui-btn-xs" lay-event="detail">详情</a>
</script>
