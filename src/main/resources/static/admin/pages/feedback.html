<div class="layui-fluid" style="padding:20px;">
    <div class="layui-card">
        <div class="layui-card-header">反馈管理</div>
        <div class="layui-card-body">
            <form class="layui-form" id="feedbackSearchForm" lay-filter="feedbackSearchForm">
                <div class="layui-form-item">
                    <div class="layui-inline">
                        <label class="layui-form-label">状态</label>
                        <div class="layui-input-inline">
                            <select name="status">
                                <option value="">全部</option>
                                <option value="0">未处理</option>
                                <option value="1">已回复</option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline">
                        <button class="layui-btn" lay-submit lay-filter="searchFeedback"><i
                                class="layui-icon layui-icon-search"></i> 搜索
                        </button>
                        <button type="reset" class="layui-btn layui-btn-primary">重置</button>
                    </div>
                </div>
            </form>
            <table id="feedbackTable" lay-filter="feedbackTable"></table>
        </div>
    </div>
</div>

<script>
    layui.use(['table', 'form', 'layer'], function () {
        var table = layui.table;
        var form = layui.form;
        var layer = layui.layer;

        table.render({
            elem: '#feedbackTable',
            url: '',
            page: true,
            limit: 10,
            cols: [[
                {field: 'id', title: 'ID', width: 70},
                {field: 'userId', title: '用户ID', width: 90},
                {field: 'content', title: '反馈内容', minWidth: 250},
                {field: 'reply', title: '回复', width: 200},
                {
                    field: 'status', title: '状态', width: 100, templet: function (d) {
                        return d.status === 1 ? '<span class="layui-badge layui-bg-green">已回复</span>' : '<span class="layui-badge layui-bg-gray">未处理</span>';
                    }
                },
                {field: 'createTime', title: '提交时间', width: 170},
                {title: '操作', width: 100, fixed: 'right', toolbar: '#feedbackBar'}
            ]]
        });

        function loadData(params) {
            var p = {page: 1, size: 10};
            if (params) Object.assign(p, params);
            API.get('/api/admin/feedback/list', p, function (res) {
                if (res.code === 200) {
                    table.reload('feedbackTable', {
                        data: res.data.records,
                        page: {curr: res.data.current, limit: res.data.size, count: res.data.total}
                    });
                }
            });
        }

        loadData();

        table.on('tool(feedbackTable)', function (obj) {
            var data = obj.data;
            if (obj.event === 'reply') {
                layer.prompt({formType: 2, title: '回复反馈', value: data.reply || ''}, function (val, index) {
                    API.put('/api/admin/feedback/' + data.id + '/reply', {reply: val}, function (res) {
                        if (res.code === 200) {
                            layer.msg('回复成功');
                            loadData({page: $('.layui-laypage-curr .layui-laypage-em').next().text() || 1, size: 10});
                        } else {
                            layer.msg(res.message || '操作失败');
                        }
                        layer.close(index);
                    });
                });
            }
        });

        form.on('submit(searchFeedback)', function (data) {
            loadData(data.field);
            return false;
        });

        table.on('page(feedbackTable)', function (obj) {
            var formData = {};
            var f = $('#feedbackSearchForm').serializeArray();
            for (var i = 0; i < f.length; i++) {
                formData[f[i].name] = f[i].value;
            }
            formData.page = obj.curr;
            formData.size = obj.limit;
            loadData(formData);
        });
    });
</script>

<script type="text/html" id="feedbackBar">
    <a class="layui-btn layui-btn-xs" lay-event="reply">回复</a>
</script>
