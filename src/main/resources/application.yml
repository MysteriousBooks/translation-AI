server:
  port: 8080
  servlet:
    context-path: /

spring:
  profiles:
    active: dev
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/translation?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      # Druid监控
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        reset-enable: false
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"
      filter:
        stat:
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 2000
  redis:
    host: localhost
    port: 6379
    password:
    database: 0
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5
        max-wait: 3000ms
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT配置
jwt:
  secret: TranslationProjectSecretKey2024ForJwtTokenGenerationAtLeast256Bits
  app-expiration: 604800
  admin-expiration: 86400

# 翻译配置
translation:
  llm:
    api-url: https://api.openai.com/v1/chat/completions
    api-key: your-api-key
    model: gpt-3.5-turbo
    max-retries: 3
    timeout: 60
  price:
    per-kchar: 1.0
    min-consume: 0.01
  # supported-languages 通过 sys_config 表配置，键名：supported_languages（CSV 格式）
  supported-languages: zh-CN,en,ja,ko,fr,de,es,ru

# 邮件配置
mail:
  host: smtp.example.com
  port: 465
  username: your-email@example.com
  password: your-password
  from: your-email@example.com
  code-expire-minutes: 5

# 支付配置
pay:
  alipay:
    app-id: your-app-id
    private-key: your-private-key
    public-key: alipay-public-key
    notify-url: https://your-domain.com/api/app/wallet/recharge/callback/alipay
    return-url: https://your-domain.com/pay/result
    sandbox: true
  wechat:
    app-id: your-app-id
    mch-id: your-mch-id
    api-v3-key: your-api-v3-key
    serial-no: your-cert-serial-no
    private-key-path: /path/to/apiclient_key.pem
    notify-url: https://your-domain.com/api/app/wallet/recharge/callback/wechat

# Knife4j
knife4j:
  enable: true
  setting:
    language: zh-CN

logging:
  level:
    com.translation: debug